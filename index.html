<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paracaidista</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: 'Courier New', ui-monospace, monospace;
  }
  #gameCanvas {
    display: block;
    touch-action: none;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8);
    z-index: 10;
    font-size: 18px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #hudLives { font-size: 20px; letter-spacing: 2px; }
  #hudScore { font-size: 18px; }
  #altBar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 46px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 34px;
    height: 34vh;
    max-height: 320px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  #altBarPlane {
    font-size: 20px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8);
    line-height: 1;
  }
  #altBarTrack {
    position: relative;
    flex: 1;
    width: 6px;
    margin: 4px 0;
    background: rgba(255,255,255,0.28);
    border: 2px solid rgba(0,0,0,0.6);
    border-radius: 3px;
  }
  #altBarParachute {
    position: absolute;
    left: 50%;
    top: 0%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8);
    transition: top 0.25s linear;
  }
  #altBarGround {
    font-size: 18px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8);
    line-height: 1;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    z-index: 20;
    text-align: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .overlay.visible { display: flex; }
  .overlay h1 {
    margin: 0;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 3px 3px 0 #000;
  }
  .overlay p {
    margin: 0;
    font-size: 16px;
    opacity: .9;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .overlay button {
    margin-top: 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 14px 32px;
    border-radius: 0;
    border: 3px solid #222;
    background: #ffcc00;
    color: #222;
    box-shadow: 4px 4px 0 #000;
  }
  .overlay button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  #startSprite {
    width: min(260px, 62vw);
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border: 3px solid #222;
    box-shadow: 4px 4px 0 #000;
  }
  #overlayStart {
    background: #000;
  }
  #startTitle {
    font-size: 26px;
    letter-spacing: 2px;
    line-height: 1.3;
    animation: titleColorCycle 3s linear infinite;
    text-shadow: 3px 3px 0 #000, 0 0 14px currentColor;
  }
  @keyframes titleColorCycle {
    0%   { color: #ff2d75; }
    16%  { color: #ff9d2d; }
    33%  { color: #ffe62d; }
    50%  { color: #2dff6a; }
    66%  { color: #2dd4ff; }
    83%  { color: #b02dff; }
    100% { color: #ff2d75; }
  }
  #startHint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,.8);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    pointer-events: none;
    z-index: 10;
    opacity: .85;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="hudLives">❤️❤️❤️</div>
  <div id="hudScore">0s</div>
</div>

<div id="altBar">
  <div id="altBarPlane">✈️</div>
  <div id="altBarTrack"><div id="altBarParachute">🪂</div></div>
  <div id="altBarGround">🟫</div>
</div>

<div id="startHint">Arrastrá para moverte · Toque corto: abrir/cerrar paracaídas</div>

<div id="overlayGameOver" class="overlay">
  <h1 id="overlayTitle">Game Over</h1>
  <p id="finalScoreText"></p>
  <button id="btnRetry">Reintentar</button>
</div>

<div id="overlayStart" class="overlay visible">
  <h1 id="startTitle">RUFFUS ADVENTURES</h1>
  <img id="startSprite" alt="Paracaidista">
  <button id="btnStart">Saltar</button>
</div>

  // ==== 2.5 SONIDO (Web Audio, sintetizado, sin archivos externos) ====
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { audioCtx = null; }
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type, peakGain, delay) {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakGain || 0.2, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  // Barrido de frecuencia (glissando): además de playTone, para efectos
  // tipo "salto" de Mario Bros donde el tono sube o baja durante la nota.
  function playSweep(freqStart, freqEnd, duration, type, peakGain, delay) {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freqStart, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + duration);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peakGain || 0.18, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  // Sonido de viento ambiente (ruido blanco filtrado, generado en vez de
  // usar un archivo de audio): suena en caída libre en modo normal y se
  // corta al abrir el paracaídas (lo coordina syncMusic()).
  var windNode = null;
  function startWind() {
    if (!audioCtx || windNode) return;
    var bufferSize = 2 * audioCtx.sampleRate;
    var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    var source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    var filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 500;
    filter.Q.value = 0.7;

    var gain = audioCtx.createGain();
    gain.gain.value = 0.0001;

    var lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.17;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 220;
    lfo.connect(lfoGain).connect(filter.frequency);

    source.connect(filter).connect(gain).connect(audioCtx.destination);
    source.start();
    lfo.start();
    gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.4);

    windNode = { source: source, gain: gain, lfo: lfo };
  }
  function stopWind() {
    if (!windNode) return;
    var n = windNode;
    windNode = null;
    var t = audioCtx.currentTime;
    n.gain.gain.cancelScheduledValues(t);
    n.gain.gain.setValueAtTime(n.gain.gain.value, t);
    n.gain.gain.linearRampToValueAtTime(0.0001, t + 0.25);
    setTimeout(function () {
      try { n.source.stop(); n.lfo.stop(); } catch (err) {}
    }, 300);
  }

  // Música de fondo por modo: un secuenciador simple (setTimeout con
  // Web Audio) que repite un patrón corto de notas. Solo un track suena
  // a la vez; empieza/para según el modo activo (fiesta o paracaídas).
  var MusicEngine = (function () {
    var TRACKS = {
      party: {
        stepTime: 0.15,
        steps: [
          { bass: 220.00, lead: 659.25 },
          { bass: 220.00, lead: 0 },
          { bass: 277.18, lead: 783.99 },
          { bass: 220.00, lead: 0 },
          { bass: 329.63, lead: 659.25 },
          { bass: 220.00, lead: 0 },
          { bass: 277.18, lead: 587.33 },
          { bass: 220.00, lead: 0 }
        ]
      },
      parachute: {
        stepTime: 0.55,
        steps: [
          { bass: 196.00, lead: 392.00 },
          { bass: 0, lead: 0 },
          { bass: 220.00, lead: 440.00 },
          { bass: 0, lead: 0 }
        ]
      },
      // Jingle de pantalla de inicio: arpegio rápido estilo 8-bit ochentoso/noventoso.
      intro: {
        stepTime: 0.14,
        steps: [
          { bass: 130.81, lead: 523.25 },
          { bass: 0,      lead: 659.25 },
          { bass: 164.81, lead: 783.99 },
          { bass: 0,      lead: 659.25 },
          { bass: 146.83, lead: 587.33 },
          { bass: 0,      lead: 739.99 },
          { bass: 196.00, lead: 987.77 },
          { bass: 0,      lead: 783.99 }
        ]
      }
    };

    var current = null;
    var stepIndex = 0;
    var timerId = null;

    function playStep(track, step) {
      if (step.bass) playTone(step.bass, track.stepTime * 0.9, 'triangle', 0.07);
      if (step.lead) playTone(step.lead, track.stepTime * 0.7, 'sine', 0.05, track.stepTime * 0.05);
    }

    function tick() {
      var track = TRACKS[current];
      if (!track) return;
      playStep(track, track.steps[stepIndex]);
      stepIndex = (stepIndex + 1) % track.steps.length;
      timerId = setTimeout(tick, track.stepTime * 1000);
    }

    function start(name) {
      if (current === name) return;
      stop();
      current = name;
      stepIndex = 0;
      tick();
    }

    function stop() {
      current = null;
      if (timerId) { clearTimeout(timerId); timerId = null; }
    }

    return { start: start, stop: stop };
  })();

  // Único punto de decisión de qué suena: fiesta > paracaídas abierto >
  // viento (por defecto). Se llama en cada transición de estado relevante
  // en vez de duplicar la lógica de prioridad en cada lugar.
  function syncMusic() {
    if (Game.state !== 'playing') { MusicEngine.stop(); stopWind(); return; }
    if (Game.mode === 'party') { stopWind(); MusicEngine.start('party'); return; }
    if (Game.player.parachuteOpen) { stopWind(); MusicEngine.start('parachute'); return; }
    MusicEngine.stop();
    startWind();
  }

  // ==== 3. INPUT (Pointer Events, distinguir tap vs drag) ====
  var input = {
    active: false,
    pointerId: null,
    startX: 0, startY: 0,
    startTime: 0,
    moved: false,
    onBrainButton: false
  };

  // Botón del cerebrito: flota pegado al costado del jugador (a 2x el tamaño
  // de un objeto normal), así que su posición en pantalla cambia cuadro a
  // cuadro con Rufo. Se recalcula acá para el hit-test y para dibujarlo.
  function getBrainButtonPos() {
    var p = Game.player;
    var half = CONFIG.BRAIN_BUTTON_SIZE / 2;
    var x = p.x + p.width / 2 + CONFIG.BRAIN_BUTTON_GAP + half;
    if (x + half > canvasWidth - 4) x = p.x - p.width / 2 - CONFIG.BRAIN_BUTTON_GAP - half;
    return { x: x, y: p.y };
  }

  function isOnBrainButton(clientX, clientY) {
    if (!Game.player) return false;
    var pos = getBrainButtonPos();
    var half = CONFIG.BRAIN_BUTTON_SIZE / 2;
    return Math.abs(clientX - pos.x) <= half && Math.abs(clientY - pos.y) <= half;
  }

  function onPointerDown(e) {
    if (input.active) return;
    ensureAudio();
    syncMusic();
    input.active = true;
    input.pointerId = e.pointerId;
    input.startX = e.clientX;
    input.startY = e.clientY;
    input.startTime = performance.now();
    input.moved = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    input.onBrainButton = Game.state === 'playing' && isOnBrainButton(e.clientX, e.clientY);
    if (!input.onBrainButton && Game.player) {
      Game.player.targetX = clamp(e.clientX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    }
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!input.active || e.pointerId !== input.pointerId) return;
    if (input.onBrainButton) { e.preventDefault(); return; }
    var dx = Math.abs(e.clientX - input.startX);
    var dy = Math.abs(e.clientY - input.startY);
    if (dx > CONFIG.TAP_MAX_MOVE_PX || dy > CONFIG.TAP_MAX_MOVE_PX) input.moved = true;
    if (Game.player) Game.player.targetX = clamp(e.clientX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!input.active || e.pointerId !== input.pointerId) return;
    if (input.onBrainButton) {
      if (Game.state === 'playing') {
        if (!Game.brainModeUsed) triggerBrainMode();
        else triggerBrainModeDenied();
      }
      input.active = false;
      input.pointerId = null;
      input.onBrainButton = false;
      e.preventDefault();
      return;
    }
    var duration = performance.now() - input.startTime;
    var isTap = !input.moved && duration <= CONFIG.TAP_MAX_DURATION_MS;
    if (isTap && Game.state === 'playing') {
      Game.player.parachuteOpen = !Game.player.parachuteOpen;
      sfxParachute();
      syncMusic();
    }
    input.active = false;
    input.pointerId = null;
    e.preventDefault();
  }

  function onPointerCancel() {
    input.active = false;
    input.pointerId = null;
    input.onBrainButton = false;
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerCancel, { passive: false });

  btnRetryEl.addEventListener('click', function () {
    resetGame();
  });

  // Pantalla de inicio: portada del juego, fija (ya no cicla sprites).
  startSpriteEl.src = 'Portada%20juego.JPG';

  // El audio necesita un gesto del usuario para arrancar: el primer toque
  // en la pantalla de inicio dispara el jingle de arranque (chiptune 80s/90s).
  function startIntroMusicOnce() {
    if (Game.state !== 'start') return;
    ensureAudio();
    MusicEngine.start('intro');
  }
  overlayStartEl.addEventListener('pointerdown', startIntroMusicOnce, { passive: true });

  btnStartEl.addEventListener('click', function () {
    overlayStartEl.classList.remove('visible');
    ensureAudio();
    Game.state = 'playing';
    syncMusic();
  });

  // ==== 4. RESIZE ====
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';
    canvas.width = Math.round(canvasWidth * dpr);
    canvas.height = Math.round(canvasHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Game && Game.player) {
      Game.player.x = clamp(Game.player.x, Game.player.width / 2, canvasWidth - Game.player.width / 2);
      Game.player.targetX = clamp(Game.player.targetX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    }
    // BUG: si el resize/cambio de orientación reduce mucho el ancho, una nube
    // que quedó con x fuera del nuevo canvasWidth solo se reubica cuando el
    // ciclo vertical la recicla (puede tardar). Se re-clampea acá para que
    // ninguna nube quede varada fuera de pantalla tras un resize.
    if (Game && Game.clouds) {
      for (var i = 0; i < Game.clouds.length; i++) {
        Game.clouds[i].x = clamp(Game.clouds[i].x, -40, canvasWidth + 40);
      }
    }
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function () { setTimeout(resizeCanvas, 50); });

  // ==== 5. SPAWN SYSTEM (por oleada, hueco esquivable garantizado) ====
  function currentSpawnInterval() {
    var t = Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1);
    return lerp(CONFIG.SPAWN_INTERVAL_BASE, CONFIG.SPAWN_INTERVAL_MIN, easeOutQuad(t));
  }

  function currentObjectFallSpeed() {
    var t = Game && Game.elapsedTime ? Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1) : 0;
    var speed = lerp(CONFIG.OBJECT_FALL_SPEED_BASE, CONFIG.OBJECT_FALL_SPEED_MAX, easeOutQuad(t));
    // paracaídas abierto = el jugador frena su caída, así que los objetos
    // se le acercan más despacio
    if (Game && Game.player && Game.player.parachuteOpen) speed *= CONFIG.PARACHUTE_SPEED_FACTOR;
    return speed;
  }

  function pickWaveSize() {
    var t = Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1);
    var maxExtra = Math.round(lerp(0, 3, t)); // hasta 3 objetos extra con dificultad alta
    return randInt(1, 1 + maxExtra);
  }

  function pickRandomType() {
    if (Game.mode === 'party') return pickOneOf(PARTY_BONUS_TYPES);
    if (Math.random() < CONFIG.PARTY_TRIGGER_CHANCE) return 'wardrobe';
    if (Math.random() < CONFIG.PERIMETRAL_CHANCE) return 'perimetral';
    if (Math.random() < CONFIG.CHICKENMAN_CHANCE) return 'chickenman';
    if (Math.random() < 0.12) return pickOneOf(HEAL_TYPES);
    return pickOneOf(HAZARD_TYPES);
  }

  function spawnWave() {
    var playableWidth = canvasWidth - 2 * CONFIG.EDGE_MARGIN;
    var minGap = CONFIG.PLAYER_WIDTH + CONFIG.GAP_SAFETY_MARGIN;

    var numObjects = pickWaveSize();
    // Garantiza matemáticamente que el hueco vacío sea siempre transitable:
    // si con N objetos + 1 hueco el ancho de cada slot no alcanza, se reduce N.
    while (numObjects > 1 && (playableWidth / (numObjects + 1)) < minGap) {
      numObjects--;
    }
    if (playableWidth / (numObjects + 1) < minGap) numObjects = 1;

    var slots = numObjects + 1;
    var slotWidth = playableWidth / slots;
    var emptySlotIndex = randInt(0, slots - 1);
    var wardrobeAlreadyInWave = false;

    for (var i = 0; i < slots; i++) {
      if (i === emptySlotIndex) continue;
      var slotCenter = CONFIG.EDGE_MARGIN + slotWidth * i + slotWidth / 2;
      var jitter = (Math.random() - 0.5) * slotWidth * 0.4;
      var x = clamp(slotCenter + jitter, CONFIG.EDGE_MARGIN, canvasWidth - CONFIG.EDGE_MARGIN);
      var type = pickRandomType();
      // como mucho un ropero por oleada, para no saturar el evento especial
      if (type === 'wardrobe') {
        if (wardrobeAlreadyInWave) type = pickOneOf(HAZARD_TYPES);
        else wardrobeAlreadyInWave = true;
      }
      Game.entities.push(createFallingObject(type, x));
    }
  }

  // ==== 6. COLISIONES (AABB, x/y = centro) ====
  function aabbIntersect(a, b) {
    return (
      a.x - a.width / 2 < b.x + b.width / 2 &&
      a.x + a.width / 2 > b.x - b.width / 2 &&
      a.y - a.height / 2 < b.y + b.height / 2 &&
      a.y + a.height / 2 > b.y - b.height / 2
    );
  }

  function spawnHeartParticles(x, y) {
    var n = randInt(2, 3);
    for (var i = 0; i < n; i++) {
      Game.particles.push(createParticle(x + randRange(-14, 14), y, Math.random() < 0.5 ? '❤️' : '💗'));
    }
  }

  function spawnFloatingText(x, y, text, color) {
    Game.particles.push(createTextParticle(x, y - 6, text, color));
  }

  var CONFETTI_COLORS = ['#e63946', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#ff8fab'];
  function spawnConfetti(x, y) {
    var n = randInt(10, 14);
    for (var i = 0; i < n; i++) {
      Game.particles.push(createConfettiParticle(x, y, pickOneOf(CONFETTI_COLORS)));
    }
  }

  function enterPartyMode() {
    var duration = randRange(CONFIG.PARTY_MODE_DURATION_MIN, CONFIG.PARTY_MODE_DURATION_MAX);
    if (Game.mode === 'party') {
      // ya estaba activo: extender el timer en vez de reiniciar/ignorar
      Game.modeTimer += duration;
    } else {
      Game.mode = 'party';
      Game.modeTimer = duration;
      Game.scoreMultiplier = 2;
      // limpiar hazards ya en pantalla para que la transición no se sienta injusta
      Game.entities = Game.entities.filter(function (e) {
        return ITEM_DEFS[e.type].kind !== 'hazard';
      });
    }
  }

  function exitPartyMode() {
    Game.mode = 'normal';
    Game.scoreMultiplier = 1;
    syncMusic();
  }

  // Habilidad especial de una sola vez por partida: se activa al abrir el
  // paracaídas por primera vez. Limpia todos los obstáculos en pantalla
  // (incluido el diploma, que normalmente es imposible de agarrar) y muestra
  // un halo de luz con el cerebrito y la palabra "ego" repetida.
  function triggerBrainMode() {
    Game.brainModeUsed = true;
    Game.entities = [];
    Game.diploma = null;
    Game.brainModeHaloTimer = CONFIG.BRAIN_MODE_HALO_DURATION;
    spawnFloatingText(Game.player.x, Game.player.y - Game.player.height * 0.75, '🧠 MODO CEREBRITO', '#8CFFB0');
    spawnFloatingText(Game.player.x, Game.player.y - Game.player.height * 0.45, 'EGO EGO EGO...', '#ffffff');
    sfxBrainMode();
  }

  // Si ya se usó el modo cerebrito, un segundo intento no hace nada salvo
  // castigar con una penalización de puntaje y el chiste de "aura -1000".
  function triggerBrainModeDenied() {
    Game.score = Math.max(0, Game.score - CONFIG.BRAIN_MODE_AURA_PENALTY);
    spawnFloatingText(Game.player.x, Game.player.y - Game.player.height * 0.6, 'AURA -1000', '#ff4d4d');
    sfxAuraPenalty();
  }

  function resolveCollision(item) {
    var def = ITEM_DEFS[item.type];
    switch (def.kind) {
      case 'hazard':
        if (Game.mode !== 'party' && Game.player.invulnerableTimer <= 0) {
          Game.lives--;
          Game.player.invulnerableTimer = CONFIG.INVULNERABLE_TIME;
          sfxHazard();
          if (item.type === 'chard') {
            var spent = randInt(180, 1450);
            spawnFloatingText(item.x, item.y, '-$' + spent + ' en acelga', '#ffb703');
          } else {
            spawnFloatingText(item.x, item.y, def.text, '#ffe066');
          }
          if (Game.lives <= 0 && Game.state === 'playing') triggerGameOver();
        }
        break;
      case 'heal':
        Game.lives = Math.min(Game.lives + 1, CONFIG.PLAYER_MAX_LIVES);
        sfxHeal();
        spawnFloatingText(item.x, item.y, def.text, '#d9b6ff');
        break;
      case 'partyTrigger':
        enterPartyMode();
        sfxPartyTrigger();
        spawnFloatingText(item.x, item.y, def.text, '#ffffff');
        spawnConfetti(item.x, item.y);
        syncMusic();
        break;
      case 'partyBonus':
        Game.score += CONFIG.PARTY_BONUS_SCORE * Game.scoreMultiplier;
        Game.player.partyEffectTimer = 1.5;
        spawnHeartParticles(item.x, item.y);
        sfxPartyBonus();
        spawnFloatingText(item.x, item.y, def.text, '#ffe6fa');
        break;
      case 'chickenBonus':
        Game.score += CONFIG.CHICKEN_BONUS_SCORE * Game.scoreMultiplier;
        Game.player.partyEffectTimer = 1.2;
        spawnHeartParticles(item.x, item.y);
        sfxPartyBonus();
        spawnFloatingText(item.x, item.y, def.text, '#fff3b0');
        break;
      case 'setback':
        Game.altitude = Math.min(CONFIG.ALTITUDE_START, Game.altitude + CONFIG.PERIMETRAL_SETBACK_M);
        sfxPerimetral();
        Game.flashTimer = 0.35;
        spawnFloatingText(item.x, item.y, def.text, '#ffffff');
        break;
    }
  }

  function checkCollisions() {
    // Hitbox real más chica que el sprite dibujado (PLAYER_HITBOX_SCALE):
    // el jugador se ve grande pero perdona más al esquivar.
    var hitbox = {
      x: Game.player.x,
      y: Game.player.y,
      width: Game.player.width * CONFIG.PLAYER_HITBOX_SCALE,
      height: Game.player.height * CONFIG.PLAYER_HITBOX_SCALE
    };
    for (var i = Game.entities.length - 1; i >= 0; i--) {
      var item = Game.entities[i];
      if (!aabbIntersect(hitbox, item)) continue;
      resolveCollision(item);
      Game.entities.splice(i, 1);
    }
  }

  // ==== 7. UPDATE ====
  function updatePlayer(dt) {
    var p = Game.player;
    var accel = p.parachuteOpen ? CONFIG.HORIZ_ACCEL_OPEN : CONFIG.HORIZ_ACCEL_CLOSED;
    var dx = p.targetX - p.x;
    var maxStep = accel * dt;
    if (Math.abs(dx) <= maxStep) {
      p.x = p.targetX;
      p.vx = 0;
    } else {
      var dir = dx > 0 ? 1 : -1;
      p.x += dir * maxStep;
      p.vx = dir * maxStep / dt;
    }
    p.x = clamp(p.x, p.width / 2, canvasWidth - p.width / 2);
    p.tilt = clamp(p.vx * 0.0006, -0.35, 0.35);
    if (p.invulnerableTimer > 0) p.invulnerableTimer -= dt;
    if (p.partyEffectTimer > 0) p.partyEffectTimer -= dt;

    if (p.parachuteOpen) {
      // Con el paracaídas abierto el sprite queda quieto en la pose de
      // manos arriba (frame 0) en vez de seguir el loop de caída libre.
      p.animFrame = 0;
      p.animTimer = 0;
    } else {
      p.animTimer += dt;
      if (p.animTimer >= PLAYER_ANIM_FRAME_TIME) {
        p.animTimer -= PLAYER_ANIM_FRAME_TIME;
        p.animFrame = (p.animFrame + 1) % Math.max(1, playerSpriteImgs.length);
      }
    }
  }

  function updateEntities(dt) {
    var speed = currentObjectFallSpeed();
    for (var i = Game.entities.length - 1; i >= 0; i--) {
      var e = Game.entities[i];
      var kind = ITEM_DEFS[e.type].kind;
      var rise = (kind === 'partyBonus' || kind === 'chickenBonus') ? speed * 0.9 : speed;
      e.y -= rise * dt; // suben de abajo hacia arriba (ver createFallingObject)
      e.wobble += dt * 3;
      if (e.y + e.height / 2 < 0) Game.entities.splice(i, 1);
    }
  }

  // Título académico: un evento aparte, fuera de Game.entities, para que
  // sea imposible de agarrar (nunca pasa por checkCollisions). Siempre
  // entra por arriba y cae rápido; a mitad de camino se prende fuego y
  // termina desapareciendo con el chiste de "¡Plop!!".
  function createDiploma() {
    return {
      x: randRange(60, Math.max(120, canvasWidth - 60)),
      y: -CONFIG.OBJECT_SIZE,
      burning: false,
      timer: 0,
      smokeTimer: 0
    };
  }

  function spawnDiplomaFireParticle(x, y, emoji) {
    Game.particles.push(createParticle(x + randRange(-10, 10), y + randRange(-8, 8), emoji));
  }

  function updateDiploma(dt) {
    if (!Game.diploma) {
      if (Game.mode !== 'party' && Math.random() < CONFIG.DIPLOMA_TRIGGER_CHANCE_PER_SEC * dt) {
        Game.diploma = createDiploma();
      }
      return;
    }
    var d = Game.diploma;
    d.y += CONFIG.DIPLOMA_FALL_SPEED * dt;
    d.timer += dt;

    if (!d.burning && d.timer >= CONFIG.DIPLOMA_BURN_AFTER) {
      d.burning = true;
      d.timer = 0;
    }

    if (d.burning) {
      d.smokeTimer -= dt;
      if (d.smokeTimer <= 0) {
        spawnDiplomaFireParticle(d.x, d.y, Math.random() < 0.5 ? '🔥' : '💨');
        d.smokeTimer = 0.09;
      }
      if (d.timer >= CONFIG.DIPLOMA_BURN_DURATION) {
        for (var i = 0; i < 5; i++) spawnDiplomaFireParticle(d.x, d.y, '🔥');
        spawnFloatingText(d.x, d.y, '¡Plop!!', '#ffb347');
        Game.diploma = null;
        return;
      }
    }

    if (d.y - CONFIG.OBJECT_SIZE > canvasHeight + 40) {
      Game.diploma = null;
    }
  }

  function updateParticles(dt) {
    for (var i = Game.particles.length - 1; i >= 0; i--) {
      var pt = Game.particles[i];
      if (pt.kind === 'confetti') {
        pt.vy += 90 * dt; // gravedad leve para que caigan como confeti real
        pt.rot += pt.rotSpeed * dt;
        pt.x += pt.vx * dt;
      }
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) Game.particles.splice(i, 1);
    }
  }

  function updateClouds(dt) {
    var margin = 60;
    for (var i = 0; i < Game.clouds.length; i++) {
      var c = Game.clouds[i];
      c.y -= c.speed * dt;
      if (c.y + margin * c.scale < 0) {
        c.y = canvasHeight + margin * c.scale;
        c.x = randRange(-40, canvasWidth + 40);
        c.scale = randRange(CONFIG.CLOUD_MIN_SCALE, CONFIG.CLOUD_MAX_SCALE);
        c.speed = randRange(CONFIG.CLOUD_MIN_SPEED, CONFIG.CLOUD_MAX_SPEED);
        c.opacity = randRange(0.5, 0.85);
      }
    }
  }

  function updatePartyMode(dt) {
    if (Game.mode !== 'party') return;
    Game.modeTimer -= dt;
    Game.bgHueTime += dt;
    if (Game.modeTimer <= 0) exitPartyMode();
  }

  function update(dt) {
    Game.elapsedTime += dt;
    Game.score += dt * CONFIG.SCORE_RATE * Game.scoreMultiplier;

    var descentRate = Game.player.parachuteOpen ? CONFIG.DESCENT_RATE_OPEN : CONFIG.DESCENT_RATE_CLOSED;
    Game.altitude -= descentRate * dt;
    if (Game.altitude <= 0 && Game.state === 'playing') {
      Game.altitude = 0;
      triggerWin();
    }

    if (Game.flashTimer > 0) Game.flashTimer -= dt;
    if (Game.brainModeHaloTimer > 0) Game.brainModeHaloTimer -= dt;
    if (!Game.player.parachuteOpen) Game.windPhase = (Game.windPhase + dt * 1.8) % 1;

    Game.spawnAccumulator += dt * 1000;
    if (!Game.diploma && Game.spawnAccumulator >= currentSpawnInterval()) {
      Game.spawnAccumulator = 0;
      spawnWave();
    }

    updatePlayer(dt);
    updateEntities(dt);
    updateParticles(dt);
    updateClouds(dt);
    updateDiploma(dt);
    updatePartyMode(dt);
    checkCollisions();
  }

  function triggerGameOver() {
    Game.state = 'gameover';
    sfxGameOver();
    overlayTitleEl.textContent = 'Game Over';
    var altRemaining = Math.max(0, Math.round(Game.altitude));
    finalScoreTextEl.textContent = 'Te quedaste a ' + altRemaining.toLocaleString('es-AR') + ' m del piso · Score: ' + Math.floor(Game.score);
    overlayGameOverEl.classList.add('visible');
    syncMusic();
  }

  function triggerWin() {
    Game.state = 'won';
    sfxWin();
    overlayTitleEl.textContent = '¡Aterrizaste!';
    finalScoreTextEl.textContent = 'Llegaste al piso en ' + Math.floor(Game.elapsedTime) + ' s · Score: ' + Math.floor(Game.score);
    overlayGameOverEl.classList.add('visible');
    syncMusic();
  }

  // ==== 8. RENDER ====

  // Los emojis a color (Apple Color Emoji, etc.) no se dibujan con fillText()
  // en canvas cuando el contexto tiene una transformación aplicada (bug de
  // WebKit/Safari en iOS; el escalado por devicePixelRatio de resizeCanvas
  // cuenta como transformación). Por eso se pre-renderiza cada emoji una
  // sola vez en un canvas auxiliar SIN transformar, y luego se pinta con
  // drawImage(), que no tiene ese problema.
  var emojiSpriteCache = {};
  var EMOJI_SPRITE_SRC_SIZE = 128;
  function getEmojiSprite(emoji) {
    var cached = emojiSpriteCache[emoji];
    if (cached) return cached;
    var off = document.createElement('canvas');
    off.width = EMOJI_SPRITE_SRC_SIZE;
    off.height = EMOJI_SPRITE_SRC_SIZE;
    var octx = off.getContext('2d');
    octx.font = Math.round(EMOJI_SPRITE_SRC_SIZE * 0.82) + 'px ' + CONFIG.EMOJI_FONT;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(emoji, EMOJI_SPRITE_SRC_SIZE / 2, EMOJI_SPRITE_SRC_SIZE / 2 + EMOJI_SPRITE_SRC_SIZE * 0.04);
    emojiSpriteCache[emoji] = off;
    return off;
  }
  function drawEmoji(emoji, x, y, size) {
    ctx.drawImage(getEmojiSprite(emoji), x - size / 2, y - size / 2, size, size);
  }

  var skyGradientCache = null, skyGradientCacheH = 0;
  function getSkyGradient() {
    if (!skyGradientCache || skyGradientCacheH !== canvasHeight) {
      skyGradientCache = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradientCache.addColorStop(0, '#4fa8ff');
      skyGradientCache.addColorStop(1, '#bfe6ff');
      skyGradientCacheH = canvasHeight;
    }
    return skyGradientCache;
  }

  function renderBackground() {
    if (Game.mode === 'party') {
      var hue = (Game.bgHueTime * 70) % 360;
      var grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      grad.addColorStop(0, 'hsl(' + hue + ',85%,55%)');
      grad.addColorStop(1, 'hsl(' + ((hue + 120) % 360) + ',85%,45%)');
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = getSkyGradient();
    }
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
  }

  // La nube se dibuja UNA sola vez a baja resolución en un canvas auxiliar
  // (look pixel art) y después se pinta escalada con drawImage: es el único
  // elemento del fondo, junto con el personaje, que queda "pixelado" — el
  // resto del juego (texto, objetos, fondo) se renderiza normal/nítido.
  // Se arma con un grid de bloques (como las nubes clásicas de 8-bit) en
  // vez de elipses superpuestas, que al bajar la resolución se veían como
  // manchas circulares en vez de una nube reconocible.
  var CLOUD_GRID = [
    '0011001000',
    '0111111100',
    '1111111110',
    '1111111111',
    '0111111110',
    '0011111000'
  ];
  var CLOUD_CELL = 5;
  var CLOUD_SPRITE_W = CLOUD_CELL * CLOUD_GRID[0].length;
  var CLOUD_SPRITE_H = CLOUD_CELL * CLOUD_GRID.length;
  var cloudSpriteCache = null;
  function getCloudSprite() {
    if (cloudSpriteCache) return cloudSpriteCache;
    var off = document.createElement('canvas');
    off.width = CLOUD_SPRITE_W;
    off.height = CLOUD_SPRITE_H;
    var octx = off.getContext('2d');
    octx.fillStyle = '#ffffff';
    for (var row = 0; row < CLOUD_GRID.length; row++) {
      for (var col = 0; col < CLOUD_GRID[row].length; col++) {
        if (CLOUD_GRID[row][col] === '1') {
          octx.fillRect(col * CLOUD_CELL, row * CLOUD_CELL, CLOUD_CELL, CLOUD_CELL);
        }
      }
    }
    // Sombra sutil en la fila de abajo para que se separe del cielo
    // (incluido el modo fiesta, donde el fondo rota de color y puede quedar
    // muy claro y "comerse" el blanco de la nube).
    var lastRow = CLOUD_GRID.length - 1;
    octx.fillStyle = 'rgba(90,110,140,0.45)';
    for (var col2 = 0; col2 < CLOUD_GRID[lastRow].length; col2++) {
      if (CLOUD_GRID[lastRow][col2] === '1') {
        octx.fillRect(col2 * CLOUD_CELL, CLOUD_SPRITE_H - 2, CLOUD_CELL, 2);
      }
    }
    cloudSpriteCache = off;
    return cloudSpriteCache;
  }

  function drawCloud(c) {
    var sprite = getCloudSprite();
    var w = CLOUD_SPRITE_W * 2 * c.scale;
    var h = CLOUD_SPRITE_H * 2 * c.scale;
    ctx.save();
    ctx.globalAlpha = c.opacity;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sprite, c.x - w / 2, c.y - h / 2, w, h);
    ctx.restore();
  }

  function renderClouds() {
    for (var i = 0; i < Game.clouds.length; i++) {
      drawCloud(Game.clouds[i]);
    }
  }

  var PLAYER_ANIM_FRAME_TIME = 0.13; // segundos por frame del loop de caída (~7.7 fps, cadencia típica de sprite retro)
  var playerSpriteImgs = PLAYER_SPRITE_FRAMES.map(function (src) {
    var img = new Image();
    img.loaded = false;
    img.onload = function () { img.loaded = true; };
    img.onerror = function () { img.loaded = false; };
    img.src = src;
    return img;
  });
  function allPlayerFramesLoaded() {
    for (var i = 0; i < playerSpriteImgs.length; i++) {
      if (!playerSpriteImgs[i].loaded) return false;
    }
    return playerSpriteImgs.length > 0;
  }

  // No existe un emoji de "ropero/armario" en Unicode (🚪 es solo una
  // puerta), así que el disparador del modo fiesta se dibuja como ícono
  // vectorial propio en vez de con drawEmoji().
  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawWardrobeIcon(x, y, size) {
    var w = size * 0.72, h = size * 0.92;
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = '#8a5a34';
    roundRectPath(-w / 2, -h / 2, w, h, 4);
    ctx.fill();
    ctx.strokeStyle = '#5c3a1e';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#6b4423';
    ctx.fillRect(-w / 2 - 2, -h / 2 - 4, w + 4, 5);

    ctx.strokeStyle = '#5c3a1e';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -h / 2 + 4);
    ctx.lineTo(0, h / 2 - 4);
    ctx.stroke();

    ctx.fillStyle = '#f1c40f';
    ctx.beginPath();
    ctx.arc(-w * 0.12, 0, 2, 0, Math.PI * 2);
    ctx.arc(w * 0.12, 0, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5c3a1e';
    ctx.fillRect(-w / 2 + 2, h / 2, 3, 4);
    ctx.fillRect(w / 2 - 5, h / 2, 3, 4);

    ctx.restore();
  }

  var PARACHUTE_PANEL_COLORS = ['#e63946', '#f4f1de', '#e63946', '#f4f1de', '#e63946', '#f4f1de'];

  function drawParachute(p) {
    var canopyY = -p.height * 0.95;
    var radius = p.width * 0.95;
    var segments = PARACHUTE_PANEL_COLORS.length;

    for (var i = 0; i < segments; i++) {
      var a0 = Math.PI + (Math.PI / segments) * i;
      var a1 = Math.PI + (Math.PI / segments) * (i + 1);
      ctx.beginPath();
      ctx.moveTo(0, canopyY);
      ctx.arc(0, canopyY, radius, a0, a1);
      ctx.closePath();
      ctx.fillStyle = PARACHUTE_PANEL_COLORS[i];
      ctx.fill();
    }

    ctx.strokeStyle = '#b3232f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, canopyY, radius, Math.PI, 0);
    ctx.stroke();

    var anchorL = { x: -p.width * 0.28, y: -p.height * 0.32 };
    var anchorR = { x: p.width * 0.28, y: -p.height * 0.32 };
    ctx.strokeStyle = 'rgba(70,50,30,0.75)';
    ctx.lineWidth = 1.4;
    var lineCount = 6;
    for (var j = 0; j <= lineCount; j++) {
      var ang = Math.PI + (Math.PI / lineCount) * j;
      var ex = Math.cos(ang) * radius;
      var ey = canopyY + Math.sin(ang) * radius;
      var anchor = ex <= 0 ? anchorL : anchorR;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(anchor.x, anchor.y);
      ctx.stroke();
    }
  }

  function drawPlayerPlaceholder(p) {
    ctx.fillStyle = '#f4c27a';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.width * 0.28, p.height * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-p.width * 0.5, -p.height * 0.3);
    ctx.lineTo(p.width * 0.5, -p.height * 0.3);
    ctx.stroke();
  }

  // Rayas de viento a los costados del jugador en caída libre; desaparecen
  // apenas se abre el paracaídas (coincide con que el sonido de viento
  // también corta). Suben como el resto del mundo (objetos, nubes), no bajan.
  function drawWindStreaks(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    var n = 4;
    for (var i = 0; i < n; i++) {
      var phase = (Game.windPhase + i * 0.27) % 1;
      var side = i % 2 === 0 ? -1 : 1;
      var sx = side * (p.width * 0.62 + (i % 2) * p.width * 0.1);
      var len = 16 + phase * 12;
      var yBottom = p.height * 0.7 - phase * p.height * 1.6;
      ctx.globalAlpha = 0.6 * (1 - phase);
      ctx.beginPath();
      ctx.moveTo(sx, yBottom);
      ctx.lineTo(sx, yBottom - len);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    var p = Game.player;
    if (!p.parachuteOpen) drawWindStreaks(p);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.tilt);
    if (p.invulnerableTimer > 0 && Math.floor(p.invulnerableTimer * 12) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    if (allPlayerFramesLoaded()) {
      var frame = playerSpriteImgs[p.animFrame % playerSpriteImgs.length];
      ctx.imageSmoothingEnabled = false; // mantiene el look pixel art nítido al escalar
      ctx.drawImage(frame, -p.width / 2, -p.height / 2, p.width, p.height);
    } else {
      drawPlayerPlaceholder(p);
    }
    ctx.restore();

    if (p.parachuteOpen) {
      ctx.save();
      ctx.translate(p.x, p.y);
      drawParachute(p);
      ctx.restore();
    }

    if (p.partyEffectTimer > 0) {
      drawEmoji('🤩', p.x, p.y - p.height * 0.75, 28);
    }
  }

  function drawHalo(x, y, size) {
    var r = size * 0.85;
    var grad = ctx.createRadialGradient(x, y, size * 0.15, x, y, r);
    grad.addColorStop(0, 'rgba(255,245,180,0.65)');
    grad.addColorStop(1, 'rgba(255,245,180,0)');
    ctx.save();
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Halo de luz pulsante del modo cerebrito: crece y se desvanece a lo
  // largo de BRAIN_MODE_HALO_DURATION, centrado en el jugador.
  function renderBrainHalo() {
    var t = clamp(Game.brainModeHaloTimer / CONFIG.BRAIN_MODE_HALO_DURATION, 0, 1);
    var p = Game.player;
    var size = lerp(50, 260, 1 - t);
    ctx.save();
    ctx.globalAlpha = t;
    drawHalo(p.x, p.y, size);
    ctx.restore();
  }

  // Botón del cerebrito: flota pegado al costado del jugador durante toda
  // la partida (el doble de grande que un objeto normal), listo para
  // activar el modo cerebrito con un toque dedicado (ver isOnBrainButton).
  function renderBrainButton() {
    var pos = getBrainButtonPos();
    var pulse = Game.brainModeHaloTimer > 0
      ? 1 + 0.25 * Math.sin(Game.brainModeHaloTimer * 18)
      : 1 + Math.sin(Game.elapsedTime * 3) * 0.05;
    drawHalo(pos.x, pos.y, CONFIG.BRAIN_BUTTON_SIZE * 0.7 * pulse);
    drawEmoji('🧠', pos.x, pos.y, CONFIG.BRAIN_BUTTON_SIZE * pulse);
  }

  function renderEntities() {
    for (var i = 0; i < Game.entities.length; i++) {
      var e = Game.entities[i];
      var wob = Math.sin(e.wobble) * 4;
      var def = ITEM_DEFS[e.type];
      // Los objetos buenos (los que dan vida) llevan un halo para que se
      // distingan de un vistazo de los que hacen daño.
      if (def.kind === 'heal') drawHalo(e.x + wob, e.y, CONFIG.OBJECT_SIZE);
      if (e.type === 'wardrobe') {
        drawWardrobeIcon(e.x + wob, e.y, CONFIG.OBJECT_SIZE);
      } else {
        drawEmoji(def.emoji, e.x + wob, e.y, CONFIG.OBJECT_SIZE);
      }
    }
  }

  function renderDiploma() {
    if (!Game.diploma) return;
    var d = Game.diploma;
    if (d.burning) {
      // parpadea entre el diploma y el fuego para vender que se está quemando
      drawEmoji(Math.floor(d.timer * 14) % 2 === 0 ? '🔥' : '📜', d.x, d.y, CONFIG.OBJECT_SIZE);
    } else {
      drawEmoji('📜', d.x, d.y, CONFIG.OBJECT_SIZE);
      ctx.save();
      ctx.font = 'bold 13px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText('Título académico', d.x, d.y - CONFIG.OBJECT_SIZE * 0.75);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Título académico', d.x, d.y - CONFIG.OBJECT_SIZE * 0.75);
      ctx.restore();
    }
  }

  function renderFlash() {
    if (Game.flashTimer <= 0) return;
    var a = clamp(Game.flashTimer / 0.35, 0, 1) * 0.55;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    ctx.restore();
  }

  function renderParticles() {
    for (var i = 0; i < Game.particles.length; i++) {
      var pt = Game.particles[i];
      var a = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      if (pt.kind === 'confetti') {
        ctx.translate(pt.x, pt.y);
        ctx.rotate(pt.rot);
        ctx.fillStyle = pt.color;
        ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
      } else if (pt.text) {
        ctx.font = 'bold 15px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(pt.text, pt.x, pt.y);
        ctx.fillStyle = pt.color;
        ctx.fillText(pt.text, pt.x, pt.y);
      } else {
        drawEmoji(pt.emoji, pt.x, pt.y, 26);
      }
      ctx.restore();
    }
  }

  function render() {
    renderBackground();
    renderClouds();
    renderEntities();
    renderDiploma();
    drawPlayer();
    if (Game.brainModeHaloTimer > 0) renderBrainHalo();
    if (Game.state === 'playing') renderBrainButton();
    renderParticles();
    renderFlash();
  }

  function formatAltitude(m) {
    return Math.max(0, Math.round(m)).toLocaleString('es-AR') + ' m';
  }

  function updateHUD() {
    var lives = Math.max(0, Game.lives);
    hudLivesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(CONFIG.PLAYER_MAX_LIVES - lives);
    hudScoreEl.textContent = formatAltitude(Game.altitude) + (Game.mode === 'party' ? ' 🏳️‍🌈' : '');

    // Progreso de la caída: 0% recién saltado (avión, arriba) -> 100% en el piso (abajo).
    var progress = clamp(1 - Game.altitude / CONFIG.ALTITUDE_START, 0, 1);
    altBarParachuteEl.style.top = (progress * 100) + '%';
  }

  // ==== 9. MAIN LOOP ====
  var lastTimestamp = null;
  function computeDeltaTime(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    var dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    return Math.min(Math.max(dt, 0), 0.05);
  }

  function gameLoop(timestamp) {
    var dt = computeDeltaTime(timestamp);
    if (Game.state === 'playing') update(dt);
    render();
    updateHUD();
    requestAnimationFrame(gameLoop);
  }

  // ==== 10. INICIALIZACIÓN ====
  resizeCanvas();
  resetGame();
  // Arranca en pausa mostrando la pantalla de inicio; recién juega la
  // física/spawns cuando se toca "Saltar" (ver el listener de btnStartEl).
  Game.state = 'start';
  requestAnimationFrame(gameLoop);
})();
</script>
