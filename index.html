<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paracaidista</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    overscroll-behavior: none;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #gameCanvas {
    display: block;
    touch-action: none;
    width: 100vw;
    height: 100vh;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    z-index: 10;
    font-size: 20px;
    font-weight: 600;
  }
  #hudLives { font-size: 22px; letter-spacing: 2px; }
  #hudScore { font-size: 20px; }
  .overlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0,0,0,0.78);
    color: #fff;
    z-index: 20;
    text-align: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .overlay.visible { display: flex; }
  .overlay h1 { margin: 0; font-size: 36px; }
  .overlay p { margin: 0; font-size: 18px; opacity: .9; }
  .overlay button {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: #ffcc00;
    color: #222;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  .overlay button:active { transform: scale(0.96); }
  #startHint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.7);
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
    opacity: .85;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="hudLives">❤️❤️❤️</div>
  <div id="hudScore">0s</div>
</div>

<div id="startHint">Arrastrá para moverte · Toque corto: abrir/cerrar paracaídas</div>

<div id="overlayGameOver" class="overlay">
  <h1>Game Over</h1>
  <p id="finalScoreText"></p>
  <button id="btnRetry">Reintentar</button>
</div>

  // ==== 1. CONFIG / CONSTANTES ====
  var CONFIG = {
    PLAYER_WIDTH: 72,
    PLAYER_HEIGHT: 72,
    PLAYER_MAX_LIVES: 3,
    PLAYER_START_LIVES: 3,

    FALL_SPEED_CLOSED: 6,        // "caída de pantalla" del jugador (efecto visual/tilt), no mueve Y real
    HORIZ_ACCEL_CLOSED: 900,     // px/seg^2 hacia targetX, control reducido (paracaídas cerrado)
    HORIZ_ACCEL_OPEN: 2000,      // control mejorado con paracaídas abierto

    SPAWN_INTERVAL_BASE: 950,    // ms entre oleadas al inicio
    SPAWN_INTERVAL_MIN: 380,     // piso de dificultad
    DIFFICULTY_RAMP_TIME: 90,    // segundos hasta estabilizar dificultad

    OBJECT_FALL_SPEED_BASE: 150, // px/seg
    OBJECT_FALL_SPEED_MAX: 460,

    OBJECT_SIZE: 44,
    EDGE_MARGIN: 28,
    GAP_SAFETY_MARGIN: 26,       // margen extra sobre el ancho del jugador para el hueco

    PARTY_MODE_DURATION_MIN: 10,
    PARTY_MODE_DURATION_MAX: 15,
    PARTY_TRIGGER_CHANCE: 0.05,  // probabilidad de que una oleada incluya el ropero

    TAP_MAX_DURATION_MS: 220,
    TAP_MAX_MOVE_PX: 14,

    INVULNERABLE_TIME: 1.0,      // segundos de i-frames tras recibir daño
    PARTY_BONUS_SCORE: 40,
    SCORE_RATE: 10               // puntos por segundo sobrevivido (x2 en party)
  };

  // Definición central de tipos de objeto: emoji + comportamiento.
  var ITEM_DEFS = {
    bottle:    { emoji: '🍾', kind: 'hazard' },
    chard:     { emoji: '🥬', kind: 'hazard' },
    lawsuit:   { emoji: '📄', kind: 'hazard' },
    chocolate: { emoji: '🍫', kind: 'heal' },
    wardrobe:  { emoji: '🚪', kind: 'partyTrigger' },
    muscleman: { emoji: '💪', kind: 'partyBonus' }
  };

  // ==== 2. ESTADO DEL JUEGO ====
  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var hudLivesEl = document.getElementById('hudLives');
  var hudScoreEl = document.getElementById('hudScore');
  var overlayGameOverEl = document.getElementById('overlayGameOver');
  var finalScoreTextEl = document.getElementById('finalScoreText');
  var btnRetryEl = document.getElementById('btnRetry');

  var Game = null; // se crea en resetGame()
  var canvasWidth = 0, canvasHeight = 0, dpr = 1;

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
  function randRange(a, b) { return a + Math.random() * (b - a); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
  function pickOneOf(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function createPlayer() {
    return {
      x: canvasWidth / 2,
      y: canvasHeight * 0.32,
      vx: 0,
      targetX: canvasWidth / 2,
      width: CONFIG.PLAYER_WIDTH,
      height: CONFIG.PLAYER_HEIGHT,
      parachuteOpen: false,
      invulnerableTimer: 0,
      partyEffectTimer: 0,
      tilt: 0
    };
  }

  function createFallingObject(type, x) {
    return {
      type: type,
      x: x,
      y: -CONFIG.OBJECT_SIZE,
      width: CONFIG.OBJECT_SIZE,
      height: CONFIG.OBJECT_SIZE,
      vy: currentObjectFallSpeed(),
      wobble: Math.random() * Math.PI * 2
    };
  }

  function createParticle(x, y, emoji) {
    return { x: x, y: y, vy: -70, life: 0.9, maxLife: 0.9, emoji: emoji };
  }

  function resetGame() {
    Game = {
      state: 'playing',           // 'playing' | 'gameover'
      mode: 'normal',             // 'normal' | 'party'
      modeTimer: 0,
      elapsedTime: 0,
      score: 0,
      scoreMultiplier: 1,
      lives: CONFIG.PLAYER_START_LIVES,
      spawnAccumulator: 0,
      entities: [],
      particles: [],
      bgHueTime: 0,
      player: createPlayer()
    };
    overlayGameOverEl.classList.remove('visible');
  }

  // ==== 3. INPUT (Pointer Events, distinguir tap vs drag) ====
  var input = {
    active: false,
    pointerId: null,
    startX: 0, startY: 0,
    startTime: 0,
    moved: false
  };

  function onPointerDown(e) {
    if (input.active) return;
    input.active = true;
    input.pointerId = e.pointerId;
    input.startX = e.clientX;
    input.startY = e.clientY;
    input.startTime = performance.now();
    input.moved = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (Game.player) Game.player.targetX = clamp(e.clientX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!input.active || e.pointerId !== input.pointerId) return;
    var dx = Math.abs(e.clientX - input.startX);
    var dy = Math.abs(e.clientY - input.startY);
    if (dx > CONFIG.TAP_MAX_MOVE_PX || dy > CONFIG.TAP_MAX_MOVE_PX) input.moved = true;
    if (Game.player) Game.player.targetX = clamp(e.clientX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    e.preventDefault();
  }

  function onPointerUp(e) {
    if (!input.active || e.pointerId !== input.pointerId) return;
    var duration = performance.now() - input.startTime;
    var isTap = !input.moved && duration <= CONFIG.TAP_MAX_DURATION_MS;
    if (isTap && Game.state === 'playing') {
      Game.player.parachuteOpen = !Game.player.parachuteOpen;
    }
    input.active = false;
    input.pointerId = null;
    e.preventDefault();
  }

  function onPointerCancel() {
    input.active = false;
    input.pointerId = null;
  }

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerCancel, { passive: false });

  btnRetryEl.addEventListener('click', function () {
    resetGame();
  });

  // ==== 4. RESIZE ====
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';
    canvas.width = Math.round(canvasWidth * dpr);
    canvas.height = Math.round(canvasHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Game && Game.player) {
      Game.player.x = clamp(Game.player.x, Game.player.width / 2, canvasWidth - Game.player.width / 2);
      Game.player.targetX = clamp(Game.player.targetX, Game.player.width / 2, canvasWidth - Game.player.width / 2);
    }
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', function () { setTimeout(resizeCanvas, 50); });

  // ==== 5. SPAWN SYSTEM (por oleada, hueco esquivable garantizado) ====
  function currentSpawnInterval() {
    var t = Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1);
    return lerp(CONFIG.SPAWN_INTERVAL_BASE, CONFIG.SPAWN_INTERVAL_MIN, easeOutQuad(t));
  }

  function currentObjectFallSpeed() {
    var t = Game && Game.elapsedTime ? Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1) : 0;
    return lerp(CONFIG.OBJECT_FALL_SPEED_BASE, CONFIG.OBJECT_FALL_SPEED_MAX, easeOutQuad(t));
  }

  function pickWaveSize() {
    var t = Math.min(Game.elapsedTime / CONFIG.DIFFICULTY_RAMP_TIME, 1);
    var maxExtra = Math.round(lerp(0, 3, t)); // hasta 3 objetos extra con dificultad alta
    return randInt(1, 1 + maxExtra);
  }

  function pickRandomType() {
    if (Game.mode === 'party') return 'muscleman';
    if (Math.random() < CONFIG.PARTY_TRIGGER_CHANCE) return 'wardrobe';
    if (Math.random() < 0.10) return 'chocolate';
    return pickOneOf(['bottle', 'chard', 'lawsuit']);
  }

  function spawnWave() {
    var playableWidth = canvasWidth - 2 * CONFIG.EDGE_MARGIN;
    var minGap = CONFIG.PLAYER_WIDTH + CONFIG.GAP_SAFETY_MARGIN;

    var numObjects = pickWaveSize();
    // Garantiza matemáticamente que el hueco vacío sea siempre transitable:
    // si con N objetos + 1 hueco el ancho de cada slot no alcanza, se reduce N.
    while (numObjects > 1 && (playableWidth / (numObjects + 1)) < minGap) {
      numObjects--;
    }
    if (playableWidth / (numObjects + 1) < minGap) numObjects = 1;

    var slots = numObjects + 1;
    var slotWidth = playableWidth / slots;
    var emptySlotIndex = randInt(0, slots - 1);
    var wardrobeAlreadyInWave = false;

    for (var i = 0; i < slots; i++) {
      if (i === emptySlotIndex) continue;
      var slotCenter = CONFIG.EDGE_MARGIN + slotWidth * i + slotWidth / 2;
      var jitter = (Math.random() - 0.5) * slotWidth * 0.4;
      var x = clamp(slotCenter + jitter, CONFIG.EDGE_MARGIN, canvasWidth - CONFIG.EDGE_MARGIN);
      var type = pickRandomType();
      // como mucho un ropero por oleada, para no saturar el evento especial
      if (type === 'wardrobe') {
        if (wardrobeAlreadyInWave) type = pickOneOf(['bottle', 'chard', 'lawsuit']);
        else wardrobeAlreadyInWave = true;
      }
      Game.entities.push(createFallingObject(type, x));
    }
  }

  // ==== 6. COLISIONES (AABB, x/y = centro) ====
  function aabbIntersect(a, b) {
    return (
      a.x - a.width / 2 < b.x + b.width / 2 &&
      a.x + a.width / 2 > b.x - b.width / 2 &&
      a.y - a.height / 2 < b.y + b.height / 2 &&
      a.y + a.height / 2 > b.y - b.height / 2
    );
  }

  function spawnHeartParticles(x, y) {
    var n = randInt(2, 3);
    for (var i = 0; i < n; i++) {
      Game.particles.push(createParticle(x + randRange(-14, 14), y, Math.random() < 0.5 ? '❤️' : '💗'));
    }
  }

  function enterPartyMode() {
    var duration = randRange(CONFIG.PARTY_MODE_DURATION_MIN, CONFIG.PARTY_MODE_DURATION_MAX);
    if (Game.mode === 'party') {
      // ya estaba activo: extender el timer en vez de reiniciar/ignorar
      Game.modeTimer += duration;
    } else {
      Game.mode = 'party';
      Game.modeTimer = duration;
      Game.scoreMultiplier = 2;
      // limpiar hazards ya en pantalla para que la transición no se sienta injusta
      Game.entities = Game.entities.filter(function (e) {
        return ITEM_DEFS[e.type].kind !== 'hazard';
      });
    }
  }

  function exitPartyMode() {
    Game.mode = 'normal';
    Game.scoreMultiplier = 1;
  }

  function resolveCollision(item) {
    var def = ITEM_DEFS[item.type];
    switch (def.kind) {
      case 'hazard':
        if (Game.mode !== 'party' && Game.player.invulnerableTimer <= 0) {
          Game.lives--;
          Game.player.invulnerableTimer = CONFIG.INVULNERABLE_TIME;
          if (Game.lives <= 0) triggerGameOver();
        }
        break;
      case 'heal':
        Game.lives = Math.min(Game.lives + 1, CONFIG.PLAYER_MAX_LIVES);
        break;
      case 'partyTrigger':
        enterPartyMode();
        break;
      case 'partyBonus':
        Game.score += CONFIG.PARTY_BONUS_SCORE * Game.scoreMultiplier;
        Game.player.partyEffectTimer = 1.5;
        spawnHeartParticles(item.x, item.y);
        break;
    }
  }

  function checkCollisions() {
    for (var i = Game.entities.length - 1; i >= 0; i--) {
      var item = Game.entities[i];
      if (!aabbIntersect(Game.player, item)) continue;
      resolveCollision(item);
      Game.entities.splice(i, 1);
    }
  }

  // ==== 7. UPDATE ====
  function updatePlayer(dt) {
    var p = Game.player;
    var accel = p.parachuteOpen ? CONFIG.HORIZ_ACCEL_OPEN : CONFIG.HORIZ_ACCEL_CLOSED;
    var dx = p.targetX - p.x;
    var maxStep = accel * dt;
    if (Math.abs(dx) <= maxStep) {
      p.x = p.targetX;
      p.vx = 0;
    } else {
      var dir = dx > 0 ? 1 : -1;
      p.x += dir * maxStep;
      p.vx = dir * maxStep / dt;
    }
    p.x = clamp(p.x, p.width / 2, canvasWidth - p.width / 2);
    p.tilt = clamp(p.vx * 0.0006, -0.35, 0.35);
    if (p.invulnerableTimer > 0) p.invulnerableTimer -= dt;
    if (p.partyEffectTimer > 0) p.partyEffectTimer -= dt;
  }

  function updateEntities(dt) {
    var speed = currentObjectFallSpeed();
    for (var i = Game.entities.length - 1; i >= 0; i--) {
      var e = Game.entities[i];
      var fall = e.type === 'muscleman' ? speed * 0.9 : speed;
      e.y += fall * dt;
      e.wobble += dt * 3;
      if (e.y - e.height / 2 > canvasHeight) Game.entities.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (var i = Game.particles.length - 1; i >= 0; i--) {
      var pt = Game.particles[i];
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) Game.particles.splice(i, 1);
    }
  }

  function updatePartyMode(dt) {
    if (Game.mode !== 'party') return;
    Game.modeTimer -= dt;
    Game.bgHueTime += dt;
    if (Game.modeTimer <= 0) exitPartyMode();
  }

  function update(dt) {
    Game.elapsedTime += dt;
    Game.score += dt * CONFIG.SCORE_RATE * Game.scoreMultiplier;

    Game.spawnAccumulator += dt * 1000;
    if (Game.spawnAccumulator >= currentSpawnInterval()) {
      Game.spawnAccumulator = 0;
      spawnWave();
    }

    updatePlayer(dt);
    updateEntities(dt);
    updateParticles(dt);
    updatePartyMode(dt);
    checkCollisions();
  }

  function triggerGameOver() {
    Game.state = 'gameover';
    finalScoreTextEl.textContent = 'Sobreviviste ' + Math.floor(Game.elapsedTime) + ' segundos · Score: ' + Math.floor(Game.score);
    overlayGameOverEl.classList.add('visible');
  }

  // ==== 8. RENDER ====
  var skyGradientCache = null, skyGradientCacheH = 0;
  function getSkyGradient() {
    if (!skyGradientCache || skyGradientCacheH !== canvasHeight) {
      skyGradientCache = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      skyGradientCache.addColorStop(0, '#4fa8ff');
      skyGradientCache.addColorStop(1, '#bfe6ff');
      skyGradientCacheH = canvasHeight;
    }
    return skyGradientCache;
  }

  function renderBackground() {
    if (Game.mode === 'party') {
      var hue = (Game.bgHueTime * 70) % 360;
      var grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      grad.addColorStop(0, 'hsl(' + hue + ',85%,55%)');
      grad.addColorStop(1, 'hsl(' + ((hue + 120) % 360) + ',85%,45%)');
      ctx.fillStyle = grad;
    } else {
      ctx.fillStyle = getSkyGradient();
    }
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
  }

  var playerSpriteImg = new Image();
  var playerSpriteLoaded = false;
  if (PLAYER_SPRITE_URL) {
    playerSpriteImg.onload = function () { playerSpriteLoaded = true; };
    playerSpriteImg.onerror = function () { playerSpriteLoaded = false; };
    playerSpriteImg.src = PLAYER_SPRITE_URL;
  }

  function drawPlayerPlaceholder(p) {
    ctx.fillStyle = '#f4c27a';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.width * 0.28, p.height * 0.38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-p.width * 0.5, -p.height * 0.3);
    ctx.lineTo(p.width * 0.5, -p.height * 0.3);
    ctx.stroke();
  }

  function drawPlayer() {
    var p = Game.player;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.tilt);
    if (p.invulnerableTimer > 0 && Math.floor(p.invulnerableTimer * 12) % 2 === 0) {
      ctx.globalAlpha = 0.4;
    }
    if (playerSpriteLoaded) {
      ctx.drawImage(playerSpriteImg, -p.width / 2, -p.height / 2, p.width, p.height);
    } else {
      drawPlayerPlaceholder(p);
    }
    ctx.restore();

    if (p.parachuteOpen) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.strokeStyle = '#e63946';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -p.height * 0.85, p.width * 0.9, Math.PI, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-p.width * 0.85, -p.height * 0.85);
      ctx.lineTo(-p.width * 0.25, -p.height * 0.4);
      ctx.moveTo(p.width * 0.85, -p.height * 0.85);
      ctx.lineTo(p.width * 0.25, -p.height * 0.4);
      ctx.stroke();
      ctx.restore();
    }

    if (p.partyEffectTimer > 0) {
      ctx.save();
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🤩', p.x, p.y - p.height * 0.75);
      ctx.restore();
    }
  }

  function renderEntities() {
    ctx.font = CONFIG.OBJECT_SIZE + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < Game.entities.length; i++) {
      var e = Game.entities[i];
      var wob = Math.sin(e.wobble) * 4;
      ctx.fillText(ITEM_DEFS[e.type].emoji, e.x + wob, e.y);
    }
  }

  function renderParticles() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < Game.particles.length; i++) {
      var pt = Game.particles[i];
      var a = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '26px sans-serif';
      ctx.fillText(pt.emoji, pt.x, pt.y);
      ctx.restore();
    }
  }

  function render() {
    renderBackground();
    renderEntities();
    drawPlayer();
    renderParticles();
  }

  function updateHUD() {
    var lives = Math.max(0, Game.lives);
    hudLivesEl.textContent = '❤️'.repeat(lives) + '🖤'.repeat(CONFIG.PLAYER_MAX_LIVES - lives);
    var s = Math.floor(Game.score);
    hudScoreEl.textContent = Game.mode === 'party' ? (s + ' 🎉x2') : (s + '');
  }

  // ==== 9. MAIN LOOP ====
  var lastTimestamp = null;
  function computeDeltaTime(timestamp) {
    if (lastTimestamp === null) lastTimestamp = timestamp;
    var dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    return Math.min(Math.max(dt, 0), 0.05);
  }

  function gameLoop(timestamp) {
    var dt = computeDeltaTime(timestamp);
    if (Game.state === 'playing') update(dt);
    render();
    updateHUD();
    requestAnimationFrame(gameLoop);
  }

  // ==== 10. INICIALIZACIÓN ====
  resizeCanvas();
  resetGame();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
